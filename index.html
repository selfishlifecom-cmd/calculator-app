<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四則計算タイムアタック</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:650px;margin:auto;padding:14px;background:#f4f6fa;color:#172033}.card{background:white;border:1px solid #dce2eb;border-radius:15px;padding:15px;margin:12px 0}h1{font-size:1.35rem}select,button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #c6cfdb;background:white}select{width:100%;margin:6px 0 12px}button{min-height:44px;font-weight:650}.primary{background:#202b3c;color:white}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}#clock{text-align:center;font-size:2.7rem;font-weight:800;margin:10px}#question{text-align:center;font-size:2rem;font-weight:800;padding:14px}#answer{width:100%;font-size:1.4rem;text-align:center;margin-bottom:8px}#submit{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats div{background:#f0f3f8;border-radius:10px;padding:10px}.stats b{display:block;font-size:1.25rem}.small{font-size:.88rem;color:#5e6878}#feedback{text-align:center;min-height:24px;font-weight:bold;margin-top:8px}
</style><body><h1>四則計算タイムアタック</h1><p class="small">スマホ対応・インストール不要。1〜2桁の数で練習します。</p>
<div class="card"><label>計算の種類</label><select id="op"><option value="all">四則ランダム</option><option value="+">足し算（和）</option><option value="-">引き算（差）</option><option value="×">掛け算（積）</option><option value="÷">割り算（余りなし）</option></select><label>制限時間</label><select id="dur"><option value="60">1分</option><option value="180" selected>3分</option><option value="300">5分</option></select><div class="buttons"><button class="primary" id="start">スタート</button><button id="pause" disabled>一時停止</button><button id="reset">リセット</button><button id="fresh">新しく始める</button></div><div id="clock">03:00</div><div id="status" class="small" style="text-align:center">スタートを押してください</div></div>
<div class="card"><div id="count" class="small">回答数 0</div><div id="question">準備OK？</div><form id="form"><input id="ans" type="number" inputmode="numeric" placeholder="答えを入力" disabled><button class="primary" id="submit" disabled>回答する</button></form><div id="feedback"></div></div>
<div class="card"><div class="stats"><div><b id="ok">0</b><span class="small">正解</span></div><div><b id="ng">0</b><span class="small">不正解</span></div><div><b id="rate">—</b><span class="small">正答率</span></div></div></div><div class="card"><b>今回の記録</b><p id="history" class="small">終了後に結果を表示します。</p></div>
<script>
const $=x=>document.getElementById(x);let rem=180,base=180,timer=null,running=false,active=false,answer=0,ok=0,ng=0,n=0;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function stats(){$('ok').textContent=ok;$('ng').textContent=ng;$('rate').textContent=n?Math.round(ok/n*100)+'%':'—';$('count').textContent='回答数 '+n}
function question(){let op=$('op').value;if(op==='all')op=['+','-','×','÷'][Math.floor(Math.random()*4)];let a,b;
if(op==='+'){a=1+Math.random()*99|0;b=1+Math.random()*99|0;answer=a+b}
if(op==='-'){a=1+Math.random()*99|0;b=1+Math.random()*99|0;if(b>a)[a,b]=[b,a];answer=a-b}
if(op==='×'){a=1+Math.random()*99|0;b=1+Math.random()*9|0;answer=a*b}
if(op==='÷'){b=1+Math.random()*9|0;answer=1+Math.random()*11|0;a=b*answer}
$('question').textContent=`${a} ${op} ${b} = ?`;$('ans').value='';if(active)$('ans').focus()}
function finish(){clearInterval(timer);timer=null;running=false;active=false;$('start').disabled=true;$('pause').disabled=true;$('ans').disabled=true;$('submit').disabled=true;$('status').textContent='終了！';$('history').innerHTML=`正解 ${ok}問／不正解 ${ng}問<br>回答数 ${n}問／正答率 ${n?Math.round(ok/n*100):0}%<br>所要時間 ${fmt(base-rem)}`}
function start(){if(running||rem<=0)return;active=true;running=true;$('start').disabled=true;$('pause').disabled=false;$('ans').disabled=false;$('submit').disabled=false;$('status').textContent='計算中';question();timer=setInterval(()=>{rem--; $('clock').textContent=fmt(rem);if(rem<=0)finish()},1000)}
function reset(){clearInterval(timer);timer=null;running=active=false;rem=base=+$('dur').value;ok=ng=n=0;$('clock').textContent=fmt(rem);stats();$('start').disabled=false;$('pause').disabled=true;$('pause').textContent='一時停止';$('ans').disabled=true;$('submit').disabled=true;$('question').textContent='準備OK？';$('status').textContent='スタートを押してください';$('feedback').textContent='';$('history').textContent='終了後に結果を表示します。'}
$('start').onclick=start;$('pause').onclick=()=>{if(running){clearInterval(timer);timer=null;running=false;$('pause').textContent='再開';$('start').disabled=false;$('status').textContent='一時停止中'}else if(active){$('pause').textContent='一時停止';start()}};$('reset').onclick=reset;$('fresh').onclick=reset;$('dur').onchange=reset;$('op').onchange=()=>{if(!active)reset()};
$('form').onsubmit=e=>{e.preventDefault();if(!active||!running||$('ans').value==='')return;n++;if(Number($('ans').value)===answer){ok++;$('feedback').textContent='正解！';$('feedback').style.color='#167548'}else{ng++;$('feedback').textContent='不正解。次へ';$('feedback').style.color='#b42318'}stats();question()};reset();
</script></body></html>
